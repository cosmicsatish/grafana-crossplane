apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Wildcard custom health check for all Crossplane Grafana managed resources (*.grafana.m.crossplane.io)
  # Automatically handles Folders, Teams, Dashboards, ServiceAccounts, LBAC Rules, and Permissions.
  resource.customizations: |
    "*.grafana.m.crossplane.io/*":
      health.lua: |
        hs = {}
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "Ready" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message or "Ready"
              return hs
            end
            if condition.type == "Synced" and condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message or "Sync failed"
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for resource to become Ready"
        return hs
