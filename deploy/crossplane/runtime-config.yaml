apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-grafana-config
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              args:
                - --max-reconcile-rate=10
                - --poll=10m
              resources:
                limits:
                  cpu: "2"
                  memory: 2Gi
                requests:
                  cpu: 250m
                  memory: 512Mi
