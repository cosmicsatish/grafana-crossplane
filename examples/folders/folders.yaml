# ==============================================================================
# Starter Folders Manifest
# ==============================================================================
# Schema Options:
#   title: (Required) Display title of the folder in Grafana.
#          The folder UID is AUTOMATICALLY generated from this title (e.g. "Platform" -> "platform").
#   uid: (Optional) Only specify this if linking to an EXISTING Grafana folder that already
#        has a random or custom UID (e.g. "cde12345"). Otherwise, leave omitted.
#   parentFolderUid / parentTitle: (Optional) Parent folder for nested hierarchies.
#   permissions: (Optional) Baseline permissions for global roles (Viewer, Editor, Admin).
# ==============================================================================

folders:
  # Root Platform Folder (UID automatically becomes "platform")
  - title: Platform
    permissions:
      - role: Viewer
        permission: View

  # Nested Observability Folder under Platform (UID automatically becomes "observability")
  - title: Observability
    parentFolderUid: platform
    permissions:
      - role: Viewer
        permission: View

  # Standalone Applications Folder (UID automatically becomes "applications")
  - title: Applications
    permissions:
      - role: Viewer
        permission: View
