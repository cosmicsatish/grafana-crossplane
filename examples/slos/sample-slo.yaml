# Example Service Level Objective (SLO) Definition
slos:
  - name: "API Gateway HTTP Availability"
    description: "99.9% success rate of HTTP requests over 30 days"
    owner: platform
    objectives:
      - target: 0.999
        window: "30d"
    queries:
      ratio:
        successMetric: 'sum(rate(http_requests_total{status=~"2.."}[5m]))'
        totalMetric: 'sum(rate(http_requests_total[5m]))'
        groupBy: ["service"]
