# Example Synthetic Monitoring Check
checks:
  - job: api-gateway-healthcheck
    target: "https://api.example.com/healthz"
    frequency: 60000 # 60 seconds
    timeout: 5000   # 5 seconds
    enabled: true
    owner: platform
    probes:
      - 1 # Probe ID
    settings:
      http:
        method: GET
        validStatusCodes: [200, 204]
