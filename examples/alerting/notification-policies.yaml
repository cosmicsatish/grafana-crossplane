# Example Notification Policy Tree (can be placed in chart/alerting/)
notificationPolicies:
  - name: root-notification-policy
    owner: platform
    contactPoint: slack-sre-channel
    groupBy:
      - "alertname"
      - "grafana_folder"
    groupWait: "30s"
    groupInterval: "5m"
    repeatInterval: "4h"
    policy:
      - contactPoint: pagerduty-critical
        matcher:
          - label: "severity"
            match: "="
            value: "critical"
      - contactPoint: slack-sre-channel
        matcher:
          - label: "severity"
            match: "="
            value: "warning"
