# Example Grafana Cloud AccessPolicy using the current provider-grafana API group.
# Keep credentials out of this resource.
apiVersion: cloud.grafana.m.crossplane.io/v1alpha1
kind: AccessPolicy
metadata:
  name: logs-reader
spec:
  providerConfigRef:
    name: default
  forProvider:
    name: logs-reader
    displayName: Logs Reader
    scopes:
      - logs:read
    realms:
      - type: stack
        identifier: REPLACE_WITH_STACK_ID
