# ==============================================================================
# Starter Service Accounts Manifest
# ==============================================================================
# Schema Options:
#   name: (Required) Name of the service account in Grafana and Kubernetes.
#
#   role: (Required) Basic organizational role: None | Viewer | Editor | Admin.
#         Required by the Grafana API for every service account.
#         If you are granting fine-grained RBAC roles below, recommend: "None" or "Viewer".
#
#   roles: (Optional) List of fine-grained RBAC roles (fixed:* or plugins:*).
#          Defined right here on the service account.
#
#   preset: (Optional) Role preset from chart/catalog/role-presets.yaml (e.g. "sre").
#
#   tokens: (Optional) API tokens generated for this service account.
#     - name: (Required) Token display name.
#       secretName: (Required) Kubernetes Secret where the token value will be saved.
#       secondsToLive: (Required) Token lifetime (e.g. "30d", "90d", "1y").
#
#   isDisabled: (Optional, default: false) Disable the account without deleting it.
#   id: (Optional) Only specify this numeric ID if adopting an EXISTING service account
#       already created in Grafana (e.g. 650). Otherwise, leave omitted.
#   owner: (Optional) Team or person responsible for this service account.
# ==============================================================================

serviceAccounts:
  # CI/CD Deployment Service Account
  - name: ci-deployer
    role: Editor                       # Basic role
    isDisabled: false
    owner: devops
    tokens:
      - name: ci-deployer-token
        secretName: ci-deployer-grafana-token
        secondsToLive: "90d"
    roles:                             # Fine-grained RBAC roles
      - fixed:dashboards:writer
      - fixed:folders:writer

  # Telemetry / Monitoring Agent Service Account
  - name: telemetry-collector
    role: None                         # Set to None when using fine-grained RBAC below
    isDisabled: false
    owner: sre
    tokens:
      - name: collector-token
        secretName: telemetry-collector-grafana-token
        secondsToLive: "1y"
    roles:                             # Fine-grained RBAC roles
      - fixed:datasources:reader
