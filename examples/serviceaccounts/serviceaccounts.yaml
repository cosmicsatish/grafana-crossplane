# ==============================================================================
# Starter Service Accounts Manifest
# ==============================================================================
# Available Options:
#   name: (Required) Unique name of the service account in Grafana.
#   role: (Required) Basic organizational role: None | Viewer | Editor | Admin.
#   isDisabled: (Optional, default: false) Disable the service account without deleting it.
#   owner: (Optional) Label for accountability / team ownership.
#   tokens: (Optional) List of API tokens to generate.
#     - name: (Required) Token display name.
#       secretName: (Required) Name of the Kubernetes Secret where the token value will be saved.
#       secondsToLive: (Required) Token expiration in seconds. E.g. 2592000 (30 days), 31536000 (1 year).
#                      (Aliases supported: tokenExpires, expiresIn, ttl)
#   roles: (Optional) Direct list of fixed:* or plugins:* RBAC roles.
#   preset / presets: (Optional) Reference to role presets from chart/catalog/role-presets.yaml.
#   permissions: (Optional) Management permissions on the service account itself:
#     - permission: Edit | Admin
#       teamRef: { name: <teamSlug> }
# ==============================================================================

serviceAccounts:
  # CI/CD Deployment Service Account
  - name: ci-deployer
    role: Editor
    isDisabled: false
    owner: devops
    tokens:
      - name: ci-deployer-token
        secretName: ci-deployer-grafana-token
        secondsToLive: "90d"
    roles:
      - fixed:dashboards:writer
      - fixed:folders:writer

  # Telemetry / Monitoring Agent Service Account
  - name: telemetry-collector
    role: None
    isDisabled: false
    owner: sre
    tokens:
      - name: collector-token
        secretName: telemetry-collector-grafana-token
        secondsToLive: "1y"
    roles:
      - fixed:datasources:reader

