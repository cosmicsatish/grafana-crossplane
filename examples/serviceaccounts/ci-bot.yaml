# ServiceAccount deletion is protected by default.
# Tokens are explicit child resources; other tokens on the Grafana service account remain untouched.
serviceAccounts:
  - name: payments-ci-bot
    resourceName: payments-ci-bot
    role: Viewer
    tokens:
      - name: payments-ci-token
        secretName: payments-ci-token
        tokenExpires: 1y

    # Optional: grant one specific Team permission on this Service Account.
    # This is item-scoped and does not replace other service-account permissions.
    # permissions:
    #   - teamRef:
    #       name: sre
    #     permission: Edit
