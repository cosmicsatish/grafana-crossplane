# ==============================================================================
# Starter Team Manifest: Site Reliability Engineering (SRE)
# ==============================================================================
# Demonstrates role presets, plugin-role references, and folder permissions.
# ==============================================================================

name: SRE
email: sre-team@example.com

# IdP Group Sync (e.g. Azure AD / Okta group UUID)
syncGroups:
  - "c8f2fca2-8db2-4876-bce7-d9ea24d1e2e9"

# Uses role presets expanded by Helm from chart/catalog/role-presets.yaml
preset: sre

# Additional direct roles (e.g. Stack-specific plugin roles)
roles:
  - fixed:alerting:admin
  - plugins:grafana-kowalski-app:frontend-observability-viewer

# Folder-level permissions
folderPermissions:
  - folder: observability
    permission: Admin
  - folder: platform
    permission: Editor

# Label-Based Access Control (LBAC) on dedicated datasources
lbac:
  - datasourceUid: efwdhsqoszbb4f      # Target dedicated LBAC datasource UID
    permission: Query                  # (Optional, default: Query) Grants datasource query access
    rules:                             # LogQL or PromQL label matchers
      - '{cluster="prod", namespace="sre"}'
      - '{env="prod", job="node-exporter"}'

# Team UI Preferences (Optional)
preferences:
  theme: dark                          # light | dark | system
  timezone: utc                        # utc | browser
  # homeDashboardUid: platform-overview

# Direct Team Admins and Members (Optional, when not exclusively using IdP sync)
# admins:
#   - lead-sre@example.com
# members:
#   - engineer@example.com


