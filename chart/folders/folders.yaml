# ==============================================================================
# Starter Folders Manifest
# ==============================================================================
# Available Options:
#   uid: (Required/Recommended) Unique identifier for the folder (alphanumeric + hyphen).
#        If omitted, Helm automatically slugifies the title.
#   title: (Required) Display title of the folder in Grafana.
#   parentFolderUid: (Optional) UID of the parent folder for nested hierarchies.
#   parentTitle: (Optional) Title of the parent folder (slugified automatically).
#   allowDelete: (Optional, default: false) Controls deletion behavior when the folder
#                is removed from Git.
#                - false (Default): Crossplane orphans the folder in Grafana (safe).
#                - true: Crossplane deletes the folder in Grafana if empty.
#   preventDestroyIfNotEmpty: (Hardcoded: true) Even with allowDelete: true, Grafana API
#                             rejects deletion if dashboards or alerts reside inside.
#   permissions: (Optional) Baseline permissions granted to global roles or actors.
#                - role: Viewer | Editor | Admin
#                  permission: View | Edit | Admin
# ==============================================================================

folders:
  # Root Platform Folder
  - uid: platform
    title: Platform
    allowDelete: false
    permissions:
      - role: Viewer
        permission: View

  # Nested Observability Folder under Platform
  - uid: observability
    title: Observability
    parentFolderUid: platform
    allowDelete: false
    permissions:
      - role: Viewer
        permission: View

  # Standalone Applications Folder
  - uid: applications
    title: Applications
    allowDelete: false
    permissions:
      - role: Viewer
        permission: View
