{{- if and .Values.lbac (default false .Values.lbac.enabled) }}
{{- $datasourceUid := .Values.lbac.datasourceUid | required "lbac.datasourceUid is required when lbac.enabled=true" }}
{{- $teamUidsFile := .Files.Get "catalog/team-uids.yaml" | fromYaml | default dict }}
{{- $teams := (include "grafana-crossplane.teamsList" . | fromYaml).teams | default list }}
{{- $rulesMap := dict }}
{{- range $team := $teams }}
  {{- $slug := $team.slug | default (include "grafana-crossplane.slugify" $team.name) }}
  {{- if $team.lbacSelectors }}
    {{- $teamUid := get $teamUidsFile $slug | default $slug }}
    {{- $_ := set $rulesMap $teamUid $team.lbacSelectors }}
  {{- end }}
{{- end }}
{{- if $rulesMap }}
---
apiVersion: enterprise.grafana.m.crossplane.io/v1alpha1
kind: DataSourceConfigLbacRules
metadata:
  name: {{ printf "%s-lbac-rules" (include "grafana-crossplane.slugify" $datasourceUid) | trunc 63 | trimSuffix "-" | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "grafana-crossplane.labels" $ | nindent 4 }}
spec:
  {{- include "grafana-crossplane.providerConfigRef" $ | nindent 2 }}
  forProvider:
    datasourceUid: {{ $datasourceUid | quote }}
    rules: {{ toJson $rulesMap | quote }}
{{- end }}
{{- end }}
