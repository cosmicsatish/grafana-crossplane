{{- if and .Values.alerting (default true .Values.alerting.enabled) }}
{{- $files := (include "grafana-admin-platform.collectFiles" (dict "ctx" . "dir" "notification-policies") | fromYaml).items | default list }}
{{- range $f := $files }}
  {{- $items := $f.parsed.notificationPolicies | default $f.parsed.policies | default list }}
  {{- range $item := $items }}
---
apiVersion: alerting.grafana.m.crossplane.io/v1alpha1
kind: NotificationPolicy
{{ include "grafana-admin-platform.alertMeta" (dict "name" (include "grafana-admin-platform.slugify" ($item.name | default "default")) "wave" "2" "owner" $item.owner "root" $) -}}
spec:
  {{- include "grafana-admin-platform.providerConfigRef" $ | nindent 2 }}
  forProvider:
    contactPoint: {{ default $item.contactPoint $item.receiver | quote }}
    disableProvenance: {{ if hasKey $item "disableProvenance" }}{{ $item.disableProvenance }}{{ else }}true{{ end }}
    {{- with ($item.groupBy | default $item.group_by) }}groupBy:
      {{- toYaml . | nindent 6 }}{{ end }}
    {{- with ($item.groupWait | default $item.group_wait) }}groupWait: {{ . | quote }}{{ end }}
    {{- with ($item.groupInterval | default $item.group_interval) }}groupInterval: {{ . | quote }}{{ end }}
    {{- with ($item.repeatInterval | default $item.repeat_interval) }}repeatInterval: {{ . | quote }}{{ end }}
    {{- with ($item.muteTimings | default $item.mute_time_intervals) }}muteTimings:
      {{- toYaml . | nindent 6 }}{{ end }}
    {{- with ($item.activeTimings | default $item.active_time_intervals) }}activeTimings:
      {{- toYaml . | nindent 6 }}{{ end }}
    {{- $routes := $item.policy | default $item.routes }}
    {{- if $routes }}
    policy:
      {{- include "grafana-admin-platform.renderRoutes" (dict "routes" $routes) | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
