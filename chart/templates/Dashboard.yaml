{{- $files := (include "grafana-crossplane.collectFiles" (dict "ctx" . "dir" "dashboards") | fromYaml).items | default list -}}
{{- range $f := $files -}}
  {{- $raw := $f.parsed -}}
  {{- $data := $raw.dashboard | default $raw -}}
  {{- $base := base $f.path | trimSuffix ".json" | trimSuffix ".yaml" | trimSuffix ".yml" -}}
  {{- $folderPath := include "grafana-crossplane.folderPath" (dict "path" $f.path) -}}
  {{- $folderRequested := $data.folderUid | default $raw.folderUid | default $data.folderTitle | default $raw.folderTitle | default $folderPath -}}
  {{- $folder := include "grafana-crossplane.resolveFolderUid" (dict "folder" $folderRequested "fallback" $folderPath "root" $) -}}
  {{- $isV2 := hasPrefix (toString ($data.apiVersion | default "")) "dashboard.grafana.app/" -}}
  {{- $meta := $data.metadata | default dict -}}
  {{- $uid := $data.uid | default ($meta.uid | default (ternary ($meta.name | default "") "" $isV2)) | toString -}}
  {{- $title := $data.title | default ($meta.name | default $base) | toString -}}
  {{- $resourceKey := $uid | default (printf "%s-%s" $folder $title) -}}

---
apiVersion: oss.grafana.m.crossplane.io/v1alpha1
kind: {{ if $isV2 }}DashboardV2{{ else }}Dashboard{{ end }}
metadata:
  name: {{ include "grafana-crossplane.resourceName" $resourceKey | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "grafana-crossplane.labels" $ | nindent 4 }}
spec:
  {{- include "grafana-crossplane.providerConfigRef" $ | nindent 2 }}
  forProvider:
    {{- if $isV2 }}
    metadata:
      {{- with $uid }}
      uid: {{ . | quote }}
      {{- end }}
      {{- if $folder }}
      folderUid: {{ $folder | quote }}
      {{- end }}
    spec:
      json: {{ ($data.spec | default dict | toJson) | quote }}
      {{- with $data.spec }}
      {{- with .title }}
      title: {{ . | quote }}
      {{- end }}
      {{- end }}

      options:
        overwrite: true
    {{- else }}
    configJson: {{ ($data | toJson) | quote }}
    overwrite: true
    {{- if $folder }}
    folder: {{ $folder | quote }}
    {{- end }}
    {{- end }}
{{- end -}}
