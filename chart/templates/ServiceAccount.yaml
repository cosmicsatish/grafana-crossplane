{{- if and .Values.serviceAccounts (default true .Values.serviceAccounts.enabled) }}
{{- $accounts := (include "grafana-crossplane.saList" . | fromYaml).serviceAccounts | default list }}
{{- range $sa := $accounts }}
{{- $name := $sa.name | required "serviceAccounts[].name is required" }}
{{- $slug := $sa.resourceName | default (include "grafana-crossplane.slugify" $name) }}
{{- $tokenName := $sa.tokenName | default (printf "%s-token" $slug) }}
{{- $secretName := $sa.secretName | default (printf "%s-token" $slug) }}
---
apiVersion: oss.grafana.m.crossplane.io/v1alpha1
kind: ServiceAccount
metadata:
  name: {{ $slug | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "grafana-crossplane.labels" $ | nindent 4 }}
    {{- with $sa.owner }}
    owner: {{ . | quote }}
    {{- end }}
spec:
  {{- include "grafana-crossplane.providerConfigRef" $ | nindent 2 }}
  forProvider:
    name: {{ $name | quote }}
    role: {{ $sa.role | default "Viewer" | title | quote }}
    isDisabled: {{ $sa.isDisabled | default false }}
---
apiVersion: oss.grafana.m.crossplane.io/v1alpha1
kind: ServiceAccountToken
metadata:
  name: {{ $tokenName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "grafana-crossplane.labels" $ | nindent 4 }}
    {{- with $sa.owner }}
    owner: {{ . | quote }}
    {{- end }}
spec:
  {{- include "grafana-crossplane.providerConfigRef" $ | nindent 2 }}
  writeConnectionSecretToRef:
    name: {{ $secretName | quote }}
  forProvider:
    name: {{ $tokenName | quote }}
    secondsToLive: {{ include "grafana-crossplane.parseTtlSeconds" $sa }}
    serviceAccountRef:
      name: {{ $slug | quote }}
{{- end }}
{{- end }}
