{{- $sas := (include "grafana-crossplane.saList" . | fromYaml).serviceAccounts | default list -}}
{{- range $sa := $sas }}
{{- $name := $sa.name | required "serviceAccount.name is required" }}
{{- $slug := include "grafana-crossplane.resourceName" ($sa.resourceName | default $name) }}
{{- $role := $sa.role | required (printf "serviceAccount.role is required for %s; use Viewer, Editor, or Admin" $name) | toString | title }}
{{- if not (has $role (list "None" "Viewer" "Editor" "Admin")) }}{{ fail (printf "Invalid service account role %q for %s; use None, Viewer, Editor, or Admin" $role $name) }}{{ end }}

---
apiVersion: oss.grafana.m.crossplane.io/v1alpha1
kind: ServiceAccount
metadata:
  name: {{ $slug | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "grafana-crossplane.labels" $ | nindent 4 }}
    {{- with $sa.owner }}
    owner: {{ . | quote }}
    {{- end }}
spec:
  {{- include "grafana-crossplane.providerConfigRef" $ | nindent 2 }}
  managementPolicies:
    - Observe
    - Create
    - Update
  forProvider:
    name: {{ $name | quote }}
    role: {{ $role | quote }}
    {{- if hasKey $sa "isDisabled" }}
    isDisabled: {{ $sa.isDisabled }}
    {{- end }}
{{- $tokens := $sa.tokens | default list }}
{{- if $sa.token }}{{ $tokens = append $tokens $sa.token }}{{ end }}
{{- range $token := $tokens }}
{{- $tokenName := $token.name | required (printf "serviceAccount %s token.name is required" $name) }}
{{- $secret := $token.secretName | required (printf "serviceAccount %s token.secretName is required for token %s" $name $tokenName) }}
{{- $ttl := $token.secondsToLive | default $token.tokenExpires | default $token.expiresIn | default $token.ttl | required (printf "serviceAccount %s token lifetime is required for token %s" $name $tokenName) }}

---
apiVersion: oss.grafana.m.crossplane.io/v1alpha1
kind: ServiceAccountToken
metadata:
  name: {{ include "grafana-crossplane.resourceName" (printf "%s-%s" $slug $tokenName) | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "grafana-crossplane.labels" $ | nindent 4 }}
spec:
  {{- include "grafana-crossplane.providerConfigRef" $ | nindent 2 }}
  writeConnectionSecretToRef:
    name: {{ $secret | quote }}
  forProvider:
    name: {{ $tokenName | quote }}
    secondsToLive: {{ include "grafana-crossplane.parseTtlSeconds" (dict "secondsToLive" $ttl) }}
    serviceAccountRef:
      name: {{ $slug | quote }}
{{- end }}
{{- range $permission := ($sa.permissions | default list) }}
{{- $perm := $permission.permission | required (printf "serviceAccount %s permission.permission is required" $name) }}
{{- $actor := "" }}
{{- if $permission.teamRef }}
  {{- $actor = printf "team-%s" (include "grafana-crossplane.resourceName" $permission.teamRef.name) }}
{{- else if $permission.team }}
  {{- $actor = printf "team-%s" (include "grafana-crossplane.resourceName" $permission.team) }}
{{- else if $permission.user }}
  {{- $actor = printf "user-%s" (include "grafana-crossplane.resourceName" $permission.user) }}
{{- else if $permission.userRef }}
  {{- $actor = printf "user-ref-%s" (include "grafana-crossplane.resourceName" $permission.userRef.name) }}
{{- else }}
  {{- fail (printf "serviceAccount %s permission must specify team/teamRef or user/userRef" $name) }}
{{- end }}

---
apiVersion: oss.grafana.m.crossplane.io/v1alpha1
kind: ServiceAccountPermissionItem
metadata:
  name: {{ include "grafana-crossplane.resourceName" (printf "%s-%s-%s" $slug $actor $perm) | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "grafana-crossplane.labels" $ | nindent 4 }}
spec:
  {{- include "grafana-crossplane.providerConfigRef" $ | nindent 2 }}
  forProvider:
    permission: {{ $perm | quote }}
    serviceAccountRef:
      name: {{ $slug | quote }}
    {{- if $permission.teamRef }}
    teamRef:
      {{- toYaml $permission.teamRef | nindent 6 }}
    {{- else if $permission.userRef }}
    userRef:
      {{- toYaml $permission.userRef | nindent 6 }}
    {{- else if $permission.team }}
    team: {{ $permission.team | quote }}
    {{- else if $permission.user }}
    user: {{ $permission.user | quote }}
    {{- end }}
{{- end }}
{{- end }}
