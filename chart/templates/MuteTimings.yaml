{{- if and .Values.alerting (default true .Values.alerting.enabled) }}
{{- $files := (include "grafana-crossplane.collectFiles" (dict "ctx" . "dir" "mute-timings") | fromYaml).items | default list }}
{{- range $f := $files }}
  {{- $items := $f.parsed.muteTimings | default $f.parsed.muteTimes | default list }}
  {{- range $item := $items }}
---
apiVersion: alerting.grafana.m.crossplane.io/v1alpha1
kind: MuteTiming
{{ include "grafana-crossplane.alertMeta" (dict "name" (include "grafana-crossplane.slugify" $item.name) "wave" "2" "owner" $item.owner "root" $) }}
spec:
  {{- include "grafana-crossplane.providerConfigRef" $ | nindent 2 }}
  forProvider:
    name: {{ $item.name | quote }}
    disableProvenance: {{ if hasKey $item "disableProvenance" }}{{ $item.disableProvenance }}{{ else }}true{{ end }}
    {{- include "grafana-crossplane.renderMuteIntervals" $item | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
