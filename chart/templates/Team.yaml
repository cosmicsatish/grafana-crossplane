{{- $teams := (include "grafana-crossplane.teamsList" . | fromYaml).teams | default list -}}
{{- range $team := $teams }}
{{- $name := $team.name | required "team.name is required" }}
{{- $slug := include "grafana-crossplane.resourceName" ($team.resourceName | default $team.slug | default $name) }}

---
apiVersion: oss.grafana.m.crossplane.io/v1alpha1
kind: Team
metadata:
  name: {{ $slug | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "grafana-crossplane.labels" $ | nindent 4 }}
spec:
  {{- include "grafana-crossplane.providerConfigRef" $ | nindent 2 }}
  managementPolicies:
    - Observe
    - Create
    - Update
  forProvider:
    name: {{ $name | quote }}
    ignoreExternallySyncedMembers: true
{{- with $team.email }}
    email: {{ . | quote }}
{{- end }}
{{- with $team.admins }}
    admins:
      {{- toYaml . | nindent 6 }}
{{- end }}
{{- with $team.members }}
    members:
      {{- toYaml . | nindent 6 }}
{{- end }}
{{- with $team.preferences }}
    preferences:
      - {{- toYaml . | nindent 8 }}
{{- end }}
{{- if hasKey $team "syncGroups" }}

---
apiVersion: enterprise.grafana.m.crossplane.io/v1alpha1
kind: TeamExternalGroup
metadata:
  name: {{ include "grafana-crossplane.resourceName" (printf "%s-external-groups" $slug) | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "grafana-crossplane.labels" $ | nindent 4 }}
spec:
  {{- include "grafana-crossplane.providerConfigRef" $ | nindent 2 }}
  managementPolicies:
    - Observe
    - Create
    - Update
  forProvider:
    teamRef:
      name: {{ $slug | quote }}

    groups:
      {{- toYaml ($team.syncGroups | default list) | nindent 6 }}
{{- end }}
{{- end }}


