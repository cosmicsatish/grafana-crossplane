{{- $folders := (include "grafana-crossplane.foldersList" . | fromYaml).folders | default list -}}
{{- range $f := $folders }}
{{- $uid := $f.uid | default (include "grafana-crossplane.slugify" $f.title) }}
{{- $delete := $f.allowDelete | default false }}

---
apiVersion: oss.grafana.m.crossplane.io/v1alpha1
kind: Folder
metadata:
  name: {{ include "grafana-crossplane.resourceName" $uid | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "grafana-crossplane.labels" $ | nindent 4 }}
spec:
  {{- include "grafana-crossplane.providerConfigRef" $ | nindent 2 }}
  {{- if $delete }}
  managementPolicies:
    - Observe
    - Create
    - Update
    - Delete
  {{- else }}
  managementPolicies:
    - Observe
    - Create
    - Update
  {{- end }}
  forProvider:
    title: {{ $f.title | quote }}
    uid: {{ $uid | quote }}
    preventDestroyIfNotEmpty: true
    {{- with $f.parentUid }}
    parentFolderUid: {{ . | quote }}
    {{- else with $f.parentTitle }}
    parentFolderUid: {{ include "grafana-crossplane.slugify" (. | toString | trim) | quote }}
    {{- end }}
{{ range $p := ($f.permissions | default list) }}
{{- $permission := $p.permission | default "View" | toString | lower -}}
{{- if eq $permission "view" }}{{ $permission = "View" }}{{ else if eq $permission "query" }}{{ $permission = "View" }}{{ else if eq $permission "edit" }}{{ $permission = "Edit" }}{{ else if eq $permission "write" }}{{ $permission = "Edit" }}{{ else if eq $permission "admin" }}{{ $permission = "Admin" }}{{ else }}{{ fail (printf "Unsupported folder permission %q for %s" $permission $f.title) }}{{ end -}}
{{- $actor := "permission" -}}
{{- if $p.role }}{{ $actor = printf "role-%s" (include "grafana-crossplane.slugify" $p.role) }}{{ end -}}
{{- if $p.team }}{{ $actor = printf "team-%s" (include "grafana-crossplane.slugify" $p.team) }}{{ end -}}
{{- if $p.teamRef }}{{ $actor = printf "team-ref-%s" (include "grafana-crossplane.resourceName" $p.teamRef.name) }}{{ end -}}
{{- if $p.user }}{{ $actor = printf "user-%s" (include "grafana-crossplane.slugify" $p.user) }}{{ end -}}
{{- if $p.userRef }}{{ $actor = printf "user-ref-%s" (include "grafana-crossplane.resourceName" $p.userRef.name) }}{{ end }}

---
apiVersion: oss.grafana.m.crossplane.io/v1alpha1
kind: FolderPermissionItem
metadata:
  name: {{ include "grafana-crossplane.resourceName" (printf "%s-%s-%s" $uid $actor (lower $permission)) | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "grafana-crossplane.labels" $ | nindent 4 }}
spec:
  {{- include "grafana-crossplane.providerConfigRef" $ | nindent 2 }}
  managementPolicies:
    - Observe
    - Create
    - Update
    - Delete
  forProvider:
    folderUid: {{ $uid | quote }}
    permission: {{ $permission | quote }}
    {{- with $p.role }}
    role: {{ . | toString | title | quote }}
    {{- else with $p.team }}
    teamRef:
      name: {{ include "grafana-crossplane.slugify" . | quote }}
    {{- else with $p.teamRef }}
    teamRef:
      {{- toYaml . | nindent 6 }}
    {{- else with $p.user }}
    userId: {{ . | toString | quote }}
    {{- else with $p.userRef }}
    userRef:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
{{- end }}
