{{- if .Values.rbac.enabled | default true -}}
{{- $teams := (include "grafana-crossplane.teamsList" . | fromYaml).teams | default list -}}
{{- range $team := $teams }}
  {{- $presetNames := list -}}
  {{- with $team.preset }}{{ $presetNames = append $presetNames . }}{{ end }}
  {{- range ($team.presets | default list) }}{{ $presetNames = append $presetNames . }}{{ end }}
  {{- $roles := list -}}
  {{- range ($team.roles | default list) }}{{ $roles = append $roles . }}{{ end }}
  {{- range ($team.fixedRoles | default list) }}{{ $roles = append $roles . }}{{ end }}
  {{- $presetMap := ((include "grafana-crossplane.roleMaps" $ | fromYaml).presets | default dict) -}}
  {{- range $p := $presetNames }}{{ if not (hasKey $presetMap $p) }}{{ fail (printf "Unknown RBAC preset %q for team %s" $p $team.name) }}{{ end }}{{ range (get $presetMap $p) }}{{ $roles = append $roles . }}{{ end }}{{ end }}
  {{- range $roleName := (uniq $roles) }}

---
apiVersion: enterprise.grafana.m.crossplane.io/v1alpha1
kind: RoleAssignmentItem
metadata:
  name: {{ include "grafana-crossplane.resourceName" (printf "team-%s-%s" (include "grafana-crossplane.resourceName" ($team.resourceName | default $team.name)) $roleName) | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "grafana-crossplane.labels" $ | nindent 4 }}
spec:
  {{- include "grafana-crossplane.providerConfigRef" $ | nindent 2 }}
  managementPolicies:
    - Observe
    - Create
    - Update
    - Delete
  forProvider:
    roleUid: {{ include "grafana-crossplane.resolveRoleUid" (dict "root" $ "name" $roleName) | quote }}
    teamRef:
      name: {{ include "grafana-crossplane.resourceName" ($team.resourceName | default $team.name) | quote }}
  {{- end }}
{{- end }}
{{- $sas := (include "grafana-crossplane.saList" . | fromYaml).serviceAccounts | default list -}}
{{- range $sa := $sas }}
  {{- $presetNames := list -}}
  {{- with $sa.preset }}{{ $presetNames = append $presetNames . }}{{ end }}
  {{- range ($sa.presets | default list) }}{{ $presetNames = append $presetNames . }}{{ end }}
  {{- $roles := list -}}
  {{- range ($sa.roles | default list) }}{{ $roles = append $roles . }}{{ end }}
  {{- range ($sa.fixedRoles | default list) }}{{ $roles = append $roles . }}{{ end }}
  {{- $presetMap := ((include "grafana-crossplane.roleMaps" $ | fromYaml).presets | default dict) -}}
  {{- range $p := $presetNames }}{{ if not (hasKey $presetMap $p) }}{{ fail (printf "Unknown RBAC preset %q for service account %s" $p $sa.name) }}{{ end }}{{ range (get $presetMap $p) }}{{ $roles = append $roles . }}{{ end }}{{ end }}
  {{- range $roleName := (uniq $roles) }}

---
apiVersion: enterprise.grafana.m.crossplane.io/v1alpha1
kind: RoleAssignmentItem
metadata:
  name: {{ include "grafana-crossplane.resourceName" (printf "service-account-%s-%s" (include "grafana-crossplane.resourceName" ($sa.resourceName | default $sa.name)) $roleName) | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "grafana-crossplane.labels" $ | nindent 4 }}
spec:
  {{- include "grafana-crossplane.providerConfigRef" $ | nindent 2 }}
  managementPolicies:
    - Observe
    - Create
    - Update
    - Delete
  forProvider:
    roleUid: {{ include "grafana-crossplane.resolveRoleUid" (dict "root" $ "name" $roleName) | quote }}
    serviceAccountRef:
      name: {{ include "grafana-crossplane.resourceName" ($sa.resourceName | default $sa.name) | quote }}
  {{- end }}
{{- end }}
{{- end }}
