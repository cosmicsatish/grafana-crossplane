{{- if and .Values.datasourcePermissions (default true .Values.datasourcePermissions.enabled) }}
{{- $lbacUid := .Values.lbac.datasourceUid | default "" }}
{{- $files := (include "grafana-crossplane.loadFiles" (dict "ctx" . "glob" "datasources") | fromYaml).items | default list }}
{{- $teams := (include "grafana-crossplane.teamsList" . | fromYaml).teams | default list }}
{{- $sas := (include "grafana-crossplane.saList" . | fromYaml).serviceAccounts | default list }}
{{- $map := dict }}
{{- $aliases := .Values.datasourceAliases | default dict }}

{{- range $f := $files }}
  {{- $d := $f.parsed }}
  {{- if not $d.apiVersion }}
    {{- $items := $d.datasources | default (list $d) }}
    {{- range $ds := $items }}
      {{- $uid := $ds.uid | default $ds.name | default "" }}
      {{- if hasKey $aliases $uid }}{{ $uid = (get (get $aliases $uid) "uid") | default $uid }}{{ end }}
      {{- if and $lbacUid (or (contains "lbac" ($uid | lower)) (eq $uid "loki") (eq $uid "logs")) }}{{ $uid = $lbacUid }}{{ end }}
      {{- range $p := ($ds.permissions | default list) }}
        {{- $entry := dict "permission" ($p.permission | default "Query" | title) }}
        {{- if $p.teamRef }}{{ $_ := set $entry "teamRef" $p.teamRef }}
        {{- else if $p.team }}{{ $_ := set $entry "teamRef" (dict "name" (include "grafana-crossplane.slugify" $p.team)) }}
        {{- else if $p.userRef }}{{ $_ := set $entry "userRef" $p.userRef }}
        {{- else if $p.user }}{{ $_ := set $entry "userRef" (dict "name" (include "grafana-crossplane.slugify" $p.user)) }}
        {{- else if $p.builtInRole }}{{ $_ := set $entry "builtInRole" $p.builtInRole }}
        {{- else if $p.role }}{{ $_ := set $entry "builtInRole" $p.role }}{{ end }}
        {{- if $uid }}{{ $cur := get $map $uid | default list }}{{ $cur = append $cur $entry }}{{ $_ := set $map $uid $cur }}{{ end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}

{{- range $team := $teams }}
  {{- $teamSlug := $team.slug | default (include "grafana-crossplane.slugify" $team.name) }}
  {{- range ($team.datasourcePermissions | default list) }}
    {{- $uid := .datasource | default .datasourceUid | default "" }}
    {{- if hasKey $aliases $uid }}{{ $uid = (get (get $aliases $uid) "uid") | default $uid }}{{ end }}
    {{- if and $lbacUid (or (contains "lbac" ($uid | lower)) (eq $uid "loki") (eq $uid "logs")) }}{{ $uid = $lbacUid }}{{ end }}
    {{- if $uid }}
      {{- $entry := dict "permission" (.permission | default "Query" | title) "teamRef" (dict "name" $teamSlug) }}
      {{- $cur := get $map $uid | default list }}{{ $cur = append $cur $entry }}{{ $_ := set $map $uid $cur }}
    {{- end }}
  {{- end }}
{{- end }}

{{- range $uid, $perms := $map }}
---
apiVersion: enterprise.grafana.m.crossplane.io/v1alpha1
kind: DataSourcePermission
metadata:
  name: {{ printf "%s-permissions" (include "grafana-crossplane.slugify" $uid) | trunc 63 | trimSuffix "-" | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "grafana-crossplane.labels" $ | nindent 4 }}
spec:
  {{- include "grafana-crossplane.providerConfigRef" $ | nindent 2 }}
  forProvider:
    datasourceUid: {{ $uid | quote }}
    permissions:
      {{- toYaml $perms | nindent 6 }}
{{- end }}
{{- end }}
