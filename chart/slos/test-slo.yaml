slos:
  - name: test-api-availability
    description: "Test SLO for API Availability"
    destinationDatasource:
      - uid: "grafanacloud-prom"
    objectives:
      - value: 0.99
        window: "30d"
      - value: 0.995
        window: "7d"
    query:
      - type: "freeform"
        freeform:
          - query: "sum(rate(node_cpu_seconds_total{mode!='idle'}[5m])) / sum(rate(node_cpu_seconds_total[5m]))"
