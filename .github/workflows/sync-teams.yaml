name: Sync Grafana Teams

on:
  schedule:
    # Runs every 2 hours to keep team UIDs fresh for LBAC
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      grafana_url:
        description: 'Grafana Cloud URL'
        required: false
        default: 'https://cosmicsatish.grafana.net'

permissions:
  contents: write

concurrency:
  group: sync-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir pyyaml

      - name: Fetch and map Grafana Team UIDs
        env:
          GRAFANA_URL: ${{ github.event.inputs.grafana_url || vars.GRAFANA_URL || secrets.GRAFANA_URL || 'https://cosmicsatish.grafana.net' }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN || secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, sys, json, ssl, re, urllib.request

          url = os.environ.get("GRAFANA_URL", "").rstrip("/")
          token = os.environ.get("GRAFANA_TOKEN", "")

          if not token:
              print("ERROR: Neither GRAFANA_TOKEN nor GRAFANA_SERVICE_ACCOUNT_TOKEN secret is set.", file=sys.stderr)
              sys.exit(1)

          def slugify(name):
              s = name.strip().lower()
              s = re.sub(r"[ _./\\]+", "-", s)
              s = re.sub(r"[^a-z0-9-]", "", s)
              s = re.sub(r"-{2,}", "-", s)
              return s.strip("-")[:63]

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "grafana-crossplane-sync/1.0"
          }
          ctx = ssl._create_unverified_context()

          page = 1
          per_page = 100
          all_teams = []

          while True:
              req = urllib.request.Request(f"{url}/api/teams/search?perpage={per_page}&page={page}", headers=headers)
              try:
                  with urllib.request.urlopen(req, context=ctx) as resp:
                      if resp.status != 200:
                          print(f"ERROR: HTTP {resp.status} searching teams", file=sys.stderr)
                          sys.exit(1)
                      data = json.loads(resp.read().decode("utf-8"))
              except Exception as e:
                  print(f"ERROR: Failed to search teams: {e}", file=sys.stderr)
                  sys.exit(1)

              teams = data.get("teams", [])
              if not teams:
                  break
              all_teams.extend(teams)
              total_count = data.get("totalCount", len(all_teams))
              if len(all_teams) >= total_count or len(teams) < per_page:
                  break
              page += 1

          print(f"Found {len(all_teams)} teams in Grafana.")

          team_uids = {}
          for team in all_teams:
              name = team.get("name", "")
              slug = slugify(name)
              uid = team.get("uid")
              team_id = team.get("id")

              if not uid and team_id:
                  try:
                      detail_req = urllib.request.Request(f"{url}/api/teams/{team_id}", headers=headers)
                      with urllib.request.urlopen(detail_req, context=ctx) as detail_resp:
                          detail = json.loads(detail_resp.read().decode("utf-8"))
                          uid = detail.get("uid")
                  except Exception as e:
                      print(f"WARNING: Could not fetch detail for team {name} ({team_id}): {e}", file=sys.stderr)

              if uid:
                  team_uids[slug] = str(uid)

          lines = [
              "# AUTO-GENERATED by GitHub Actions sync workflow",
              "# DO NOT EDIT MANUALLY — maps team slug -> Grafana-assigned team UID",
              "# Regenerate: gh workflow run sync-teams.yaml",
              "#",
              ""
          ]
          for slug in sorted(team_uids.keys()):
              lines.append(f"{slug}: {team_uids[slug]}")
          lines.append("")

          dest_path = os.path.join("chart", "catalog", "team-uids.yaml")
          os.makedirs(os.path.dirname(dest_path), exist_ok=True)

          with open(dest_path, "w", encoding="utf-8") as f:
              f.write("\n".join(lines))

          print(f"Successfully updated {dest_path} with {len(team_uids)} teams.")
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain chart/catalog/team-uids.yaml) ]]; then
            git add chart/catalog/team-uids.yaml
            git commit -m "chore(catalog): sync grafana team uids [skip ci]"
            git push origin main
            echo "Changes committed and pushed successfully."
          else
            echo "No changes detected in chart/catalog/team-uids.yaml."
          fi
